<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart School AI System</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap');
        body { font-family: 'Inter', sans-serif; }
        .active-nav { background: white; color: #2563eb; box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1); }
        .modal { display: none; position: fixed; inset: 0; z-index: 100; background: rgba(15, 23, 42, 0.8); backdrop-filter: blur(4px); align-items: center; justify-content: center; }
        .show-modal { display: flex; }
        .video-flip { transform: scaleX(-1); }
        .scanning-frame {
            border: 4px solid #3b82f6;
            box-shadow: 0 0 20px rgba(59, 130, 246, 0.5);
            animation: pulse-frame 2s infinite;
        }
        @keyframes pulse-frame {
            0% { opacity: 0.5; }
            50% { opacity: 1; }
            100% { opacity: 0.5; }
        }
    </style>
</head>
<body class="bg-slate-50 text-slate-700 h-screen flex overflow-hidden">

    <!-- Sidebar -->
    <aside class="w-64 bg-slate-900 text-slate-400 flex flex-col p-6 shrink-0 shadow-xl">
        <div class="flex items-center gap-3 mb-10">
            <div class="bg-blue-600 p-2 rounded-xl text-white shadow-lg shadow-blue-500/30">
                <i class="fas fa-id-badge fa-lg"></i>
            </div>
            <h1 class="font-black text-white text-lg tracking-tighter italic uppercase text-center">AI SCHOOL</h1>
        </div>
        
        <nav class="flex-1 space-y-2">
            <button onclick="switchPage('dashboard')" id="nav-dashboard" class="nav-item w-full flex items-center gap-4 px-5 py-3.5 rounded-xl text-[10px] font-black uppercase tracking-widest transition-all">
                <i class="fas fa-chart-line text-lg"></i> <span>Dashboard</span>
            </button>
            <button onclick="switchPage('scan')" id="nav-scan" class="nav-item w-full flex items-center gap-4 px-5 py-3.5 rounded-xl text-[10px] font-black uppercase tracking-widest transition-all">
                <i class="fas fa-camera text-lg"></i> <span>AI Attendance</span>
            </button>
            <div class="h-px bg-slate-800 my-4"></div>
            <button onclick="switchPage('subjects')" id="nav-subjects" class="nav-item w-full flex items-center gap-4 px-5 py-3.5 rounded-xl text-[10px] font-black uppercase tracking-widest transition-all">
                <i class="fas fa-book text-lg"></i> <span>รายวิชา</span>
            </button>
            <button onclick="switchPage('students')" id="nav-students" class="nav-item w-full flex items-center gap-4 px-5 py-3.5 rounded-xl text-[10px] font-black uppercase tracking-widest transition-all">
                <i class="fas fa-users text-lg"></i> <span>นักศึกษา</span>
            </button>
            <button onclick="switchPage('settings')" id="nav-settings" class="nav-item w-full flex items-center gap-4 px-5 py-3.5 rounded-xl text-[10px] font-black uppercase tracking-widest transition-all">
                <i class="fas fa-cogs text-lg"></i> <span>ระบบ Admin</span>
            </button>
        </nav>

        <div class="mt-auto pt-4 border-t border-slate-800 text-center">
            <div id="connection-status" class="flex items-center justify-center gap-2 text-[9px] font-bold uppercase tracking-widest text-slate-500">
                <div id="status-dot" class="w-2 h-2 rounded-full bg-amber-500 animate-pulse"></div>
                <span id="status-text">Checking...</span>
            </div>
        </div>
    </aside>

    <!-- Main Content -->
    <main class="flex-1 flex flex-col overflow-hidden">
        <header class="h-16 bg-white border-b border-slate-200 px-8 flex items-center justify-between shrink-0">
            <h2 id="page-title" class="font-black text-slate-800 uppercase italic text-sm tracking-widest underline decoration-blue-500 decoration-4 underline-offset-8">DASHBOARD</h2>
            <button onclick="refreshData()" class="flex items-center gap-2 bg-slate-100 px-4 py-2 rounded-lg text-[10px] font-black uppercase hover:bg-slate-200 transition-all active:scale-95">
                <i class="fas fa-sync-alt" id="refresh-icon"></i> Sync Sheet Data
            </button>
        </header>

        <div id="content-area" class="flex-1 overflow-y-auto p-8 bg-slate-50/50">
            <!-- Content Injected Here -->
        </div>
    </main>

    <!-- Modal: Add Student -->
    <div id="modal-student" class="modal">
        <div class="bg-white w-full max-w-5xl rounded-[3rem] shadow-2xl overflow-hidden flex flex-col md:flex-row max-h-[90vh]">
            <div class="md:w-1/3 p-10 space-y-6 bg-slate-50 overflow-y-auto">
                <h3 class="text-2xl font-black text-slate-900 italic uppercase">New Student</h3>
                <div class="space-y-3">
                    <input type="text" id="std-id" placeholder="รหัสนักศึกษา" class="w-full bg-white p-4 rounded-xl border border-slate-200 outline-none font-bold text-sm">
                    <input type="text" id="std-name" placeholder="ชื่อ-นามสกุล" class="w-full bg-white p-4 rounded-xl border border-slate-200 outline-none font-bold text-sm">
                    <input type="text" id="std-room" placeholder="ชั้นเรียน (เช่น IT-1)" class="w-full bg-white p-4 rounded-xl border border-slate-200 outline-none font-bold text-sm">
                </div>
                <div class="grid grid-cols-3 gap-2 py-4">
                    <div id="view-0" class="aspect-square rounded-xl border-2 border-slate-200 bg-white flex items-center justify-center overflow-hidden"><span class="text-[8px] font-black text-slate-300 uppercase">หน้า</span></div>
                    <div id="view-1" class="aspect-square rounded-xl border-2 border-slate-200 bg-white flex items-center justify-center overflow-hidden"><span class="text-[8px] font-black text-slate-300 uppercase">ซ้าย</span></div>
                    <div id="view-2" class="aspect-square rounded-xl border-2 border-slate-200 bg-white flex items-center justify-center overflow-hidden"><span class="text-[8px] font-black text-slate-300 uppercase">ขวา</span></div>
                </div>
                <div class="space-y-2">
                    <button onclick="saveStudent()" class="w-full bg-blue-600 text-white py-4 rounded-xl font-black uppercase text-xs">บันทึกลงฐานข้อมูล</button>
                    <button onclick="closeModal('modal-student')" class="w-full text-slate-400 font-bold uppercase text-[9px]">ยกเลิก</button>
                </div>
            </div>
            <div class="flex-1 bg-slate-900 p-8 flex flex-col items-center justify-center gap-6 relative">
                <video id="video" autoPlay playsInline muted class="w-full max-w-lg aspect-video bg-slate-800 rounded-[2rem] object-cover video-flip border-4 border-slate-700"></video>
                <div id="step-label" class="bg-blue-600 text-white px-4 py-1 rounded-full text-[10px] font-black uppercase">ขั้นตอน: บันทึกใบหน้าด้านตรง</div>
                <button onclick="captureImage()" class="w-16 h-16 bg-white rounded-full border-4 border-blue-600 shadow-2xl flex items-center justify-center active:scale-90 transition-all">
                    <div class="w-10 h-10 bg-blue-600 rounded-full"></div>
                </button>
            </div>
        </div>
    </div>

    <!-- Modal: Add Subject -->
    <div id="modal-subject" class="modal">
        <div class="bg-white w-full max-w-md rounded-[2.5rem] p-10 shadow-2xl">
            <h3 class="text-xl font-black italic uppercase mb-6 text-slate-800">Add Subject</h3>
            <div class="space-y-4 mb-8">
                <input type="text" id="sub-id" placeholder="รหัสวิชา" class="w-full bg-slate-100 p-4 rounded-xl border-none outline-none font-bold text-sm">
                <input type="text" id="sub-name" placeholder="ชื่อวิชาเรียน" class="w-full bg-slate-100 p-4 rounded-xl border-none outline-none font-bold text-sm">
            </div>
            <div class="flex gap-3">
                <button onclick="saveSubject()" class="flex-1 bg-emerald-500 text-white py-4 rounded-xl font-black uppercase text-xs">Confirm</button>
                <button onclick="closeModal('modal-subject')" class="flex-1 bg-slate-100 text-slate-400 py-4 rounded-xl font-black uppercase text-xs">Close</button>
            </div>
        </div>
    </div>

    <div id="toast" class="fixed top-10 left-1/2 -translate-x-1/2 z-[200] px-6 py-3 rounded-xl shadow-2xl font-bold text-white transition-all hidden"></div>

    <script>
        let currentStudents = [];
        let currentSubjects = [];
        let config = { ssId: "", scriptUrl: "" };
        let captureStep = 0;
        let capturedImages = [null, null, null];
        let stream = null;
        let isAutoCheckIn = false;
        let isScanning = false;

        window.onload = () => {
            loadSettings();
            switchPage('dashboard');
        };

        function notify(msg, type = 'success') {
            const toast = document.getElementById('toast');
            toast.innerText = msg;
            toast.className = `fixed top-10 left-1/2 -translate-x-1/2 z-[200] px-6 py-3 rounded-xl shadow-2xl font-bold text-white transition-all ${type === 'success' ? 'bg-emerald-500' : 'bg-rose-500'}`;
            toast.classList.remove('hidden');
            setTimeout(() => toast.classList.add('hidden'), 3000);
        }

        function loadSettings() {
            if (typeof google !== 'undefined') {
                google.script.run.withSuccessHandler(res => {
                    config = res;
                    const dot = document.getElementById('status-dot');
                    const text = document.getElementById('status-text');
                    if (res.ssId && res.scriptUrl) {
                        text.innerText = "System Fully Linked";
                        dot.className = "w-2 h-2 rounded-full bg-emerald-500 animate-pulse";
                    } else {
                        text.innerText = "Check Cloud Config";
                        dot.className = "w-2 h-2 rounded-full bg-rose-500 animate-pulse";
                    }
                    refreshData();
                }).getSettings();
            }
        }

        async function refreshData() {
            const icon = document.getElementById('refresh-icon');
            icon.classList.add('fa-spin');
            if (typeof google !== 'undefined') {
                google.script.run.withSuccessHandler(data => {
                    currentStudents = data || [];
                    updateUI();
                    icon.classList.remove('fa-spin');
                }).getStudents();
                google.script.run.withSuccessHandler(data => {
                    currentSubjects = data || [];
                    updateUI();
                }).getSubjects();
            } else {
                setTimeout(() => icon.classList.remove('fa-spin'), 1000);
            }
        }

        function switchPage(page) {
            stopScan();
            document.querySelectorAll('.nav-item').forEach(el => el.classList.remove('active-nav'));
            document.getElementById(`nav-${page}`).classList.add('active-nav');
            document.getElementById('page-title').innerText = page.toUpperCase();
            renderPage(page);
        }

        function renderPage(page) {
            const area = document.getElementById('content-area');
            if (page === 'dashboard') {
                area.innerHTML = `
                    <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
                        <div class="bg-white p-8 rounded-[2rem] border border-slate-200 shadow-sm relative overflow-hidden group">
                            <i class="fas fa-user-graduate absolute -right-4 -bottom-4 text-slate-100 text-7xl"></i>
                            <p class="text-[9px] font-black uppercase text-slate-400 tracking-widest relative z-10">Total Students</p>
                            <h3 class="text-4xl font-black text-blue-600 relative z-10">${currentStudents.length}</h3>
                        </div>
                        <div class="bg-white p-8 rounded-[2rem] border border-slate-200 shadow-sm relative overflow-hidden group">
                            <i class="fas fa-book absolute -right-4 -bottom-4 text-slate-100 text-7xl"></i>
                            <p class="text-[9px] font-black uppercase text-slate-400 tracking-widest relative z-10">Total Subjects</p>
                            <h3 class="text-4xl font-black text-indigo-600 relative z-10">${currentSubjects.length}</h3>
                        </div>
                    </div>
                `;
            } else if (page === 'students') {
                area.innerHTML = `
                    <div class="space-y-6">
                        <div class="flex justify-between items-center">
                            <h3 class="font-black text-slate-800 italic uppercase">Students Registration</h3>
                            <button onclick="openStudentModal()" class="bg-blue-600 text-white px-6 py-3 rounded-xl font-bold text-xs active:scale-95 shadow-lg shadow-blue-500/20">Enroll Student</button>
                        </div>
                        <div class="bg-white rounded-[2rem] border border-slate-200 overflow-hidden shadow-sm">
                            <table class="w-full text-left">
                                <thead class="bg-slate-50 border-b">
                                    <tr>
                                        <th class="p-5 text-[10px] font-black uppercase text-slate-400">ID</th>
                                        <th class="p-5 text-[10px] font-black uppercase text-slate-400">Full Name & Class</th>
                                        <th class="p-5 text-right text-[10px] font-black uppercase text-slate-400">Action</th>
                                    </tr>
                                </thead>
                                <tbody class="divide-y">
                                    ${currentStudents.map(s => `
                                        <tr class="hover:bg-slate-50 transition-colors">
                                            <td class="p-5 font-bold text-blue-600">#${s.StudentID}</td>
                                            <td class="p-5 font-black uppercase">${s.FullName} (${s.Room})</td>
                                            <td class="p-5 text-right"><button class="text-slate-300 hover:text-rose-500"><i class="fas fa-trash"></i></button></td>
                                        </tr>
                                    `).join('')}
                                </tbody>
                            </table>
                        </div>
                    </div>
                `;
            } else if (page === 'subjects') {
                area.innerHTML = `
                    <div class="space-y-6">
                        <div class="flex justify-between items-center">
                            <h3 class="font-black text-slate-800 italic uppercase">Subjects Management</h3>
                            <button onclick="openSubjectModal()" class="bg-emerald-500 text-white px-6 py-3 rounded-xl font-bold text-xs active:scale-95 shadow-lg shadow-emerald-500/20">Add New Subject</button>
                        </div>
                        <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
                            ${currentSubjects.map(sub => `
                                <div class="bg-white p-8 rounded-[2rem] border border-slate-200 shadow-sm flex justify-between items-center group hover:border-blue-500 transition-all cursor-pointer">
                                    <div><p class="text-[9px] font-black text-slate-400 uppercase">${sub.id}</p><h4 class="text-lg font-black uppercase tracking-tight">${sub.name}</h4></div>
                                    <div class="bg-blue-50 p-4 rounded-xl text-blue-500 group-hover:bg-blue-500 group-hover:text-white transition-all"><i class="fas fa-book"></i></div>
                                </div>
                            `).join('')}
                        </div>
                    </div>
                `;
            } else if (page === 'scan') {
                area.innerHTML = `
                    <div class="max-w-4xl mx-auto flex flex-col items-center gap-8 py-4">
                        <div class="flex items-center gap-10 bg-white px-8 py-4 rounded-[2rem] border border-slate-200 shadow-sm w-full justify-center">
                            <div class="flex items-center gap-3">
                                <span class="text-[10px] font-black uppercase text-slate-400 tracking-widest">Auto Check-in</span>
                                <button onclick="toggleAutoCheckIn()" id="btn-autocheck" class="w-14 h-8 bg-slate-200 rounded-full p-1 transition-all relative">
                                    <div class="w-6 h-6 bg-white rounded-full shadow-md transition-all translate-x-0"></div>
                                </button>
                            </div>
                            <div class="w-px h-8 bg-slate-200"></div>
                            <p id="scan-status" class="text-[10px] font-black uppercase text-slate-400">Camera: Ready</p>
                        </div>

                        <div class="w-full aspect-video bg-slate-900 rounded-[3rem] border-[12px] border-white shadow-2xl relative overflow-hidden group">
                            <video id="scan-video" autoPlay playsInline muted class="w-full h-full object-cover video-flip"></video>
                            
                            <!-- AI Overlay Layer -->
                            <div id="ai-overlay" class="absolute inset-0 pointer-events-none flex items-center justify-center">
                                <!-- Example Frame (Hidden by default) -->
                                <div id="face-box" class="hidden absolute border-4 border-blue-500 rounded-2xl scanning-frame transition-all duration-300">
                                    <div class="absolute -top-12 left-0 bg-blue-600 text-white px-4 py-1.5 rounded-xl text-xs font-black uppercase whitespace-nowrap shadow-xl">
                                        <span id="detected-name">Identifying...</span>
                                    </div>
                                </div>
                            </div>

                            <div id="camera-placeholder" class="absolute inset-0 flex flex-col items-center justify-center bg-slate-900 text-slate-700">
                                <i class="fas fa-camera-retro text-7xl mb-4"></i>
                                <span class="font-black uppercase text-xs tracking-[0.3em]">Standby</span>
                            </div>
                        </div>

                        <div class="flex gap-4">
                            <button id="btn-scan-start" onclick="startScan()" class="bg-blue-600 text-white px-10 py-5 rounded-2xl font-black uppercase text-xs shadow-xl shadow-blue-500/30 hover:scale-105 active:scale-95 transition-all">Start Scanning</button>
                            <button id="btn-scan-stop" onclick="stopScan()" class="hidden bg-rose-500 text-white px-10 py-5 rounded-2xl font-black uppercase text-xs shadow-xl shadow-rose-500/30 active:scale-95 transition-all">Stop Camera</button>
                        </div>
                    </div>
                `;
            } else if (page === 'settings') {
                area.innerHTML = `
                    <div class="max-w-3xl space-y-6">
                        <div class="bg-white p-10 rounded-[2.5rem] border border-slate-200 shadow-sm">
                            <h3 class="font-black uppercase italic mb-8 flex items-center gap-3"><i class="fas fa-cogs text-blue-500"></i> Cloud Infrastructure</h3>
                            <div class="space-y-6">
                                <div class="space-y-2">
                                    <p class="text-[10px] font-black text-slate-400 uppercase tracking-widest">1. Google Spreadsheet ID</p>
                                    <input type="text" id="input-ssid" value="${config.ssId}" placeholder="ระบุ ID ของ Google Sheet" class="w-full bg-slate-100 p-4 rounded-xl outline-none font-bold text-sm focus:bg-white focus:ring-2 focus:ring-blue-100">
                                </div>
                                <div class="space-y-2">
                                    <p class="text-[10px] font-black text-slate-400 uppercase tracking-widest">2. Google Apps Script URL</p>
                                    <input type="text" id="input-scripturl" value="${config.scriptUrl}" placeholder="วาง Web App URL ของคุณ" class="w-full bg-slate-100 p-4 rounded-xl outline-none font-bold text-sm focus:bg-white focus:ring-2 focus:ring-blue-100">
                                </div>
                                <button onclick="updateSettings()" class="bg-blue-600 text-white w-full py-4 rounded-xl font-black uppercase text-xs shadow-lg shadow-blue-500/20 active:scale-95 transition-all">Save Cloud Configuration</button>
                            </div>
                        </div>
                        <div class="bg-white p-10 rounded-[2.5rem] border border-slate-200 shadow-sm">
                            <h3 class="font-black uppercase italic mb-8 flex items-center gap-3 text-rose-500"><i class="fas fa-exclamation-triangle"></i> Database Management</h3>
                            <div class="grid grid-cols-3 gap-4">
                                <button onclick="clearSheet('Students')" class="bg-rose-50 text-rose-500 p-4 rounded-2xl font-black uppercase text-[10px] hover:bg-rose-500 hover:text-white transition-all">Wipe Students</button>
                                <button onclick="clearSheet('Subjects')" class="bg-rose-50 text-rose-500 p-4 rounded-2xl font-black uppercase text-[10px] hover:bg-rose-500 hover:text-white transition-all">Wipe Subjects</button>
                                <button onclick="clearSheet('Attendance')" class="bg-rose-50 text-rose-500 p-4 rounded-2xl font-black uppercase text-[10px] hover:bg-rose-500 hover:text-white transition-all">Wipe History</button>
                            </div>
                        </div>
                    </div>
                `;
            }
        }

        function updateUI() {
            const page = document.getElementById('page-title').innerText.toLowerCase();
            renderPage(page);
        }

        function updateSettings() {
            const id = document.getElementById('input-ssid').value;
            const url = document.getElementById('input-scripturl').value;
            if (!id || !url) return alert("กรุณาระบุข้อมูลให้ครบถ้วน");
            notify("Connecting to Cloud...");
            google.script.run.withSuccessHandler(res => {
                if (res.success) { notify("Cloud Linked!"); loadSettings(); } else { notify(res.message, "error"); }
            }).saveSettings(id, url);
        }

        // AI Scan & Face Recognition Logic (Simulation)
        async function startScan() {
            const video = document.getElementById('scan-video');
            const placeholder = document.getElementById('camera-placeholder');
            try {
                stream = await navigator.mediaDevices.getUserMedia({ video: true });
                video.srcObject = stream;
                placeholder.classList.add('hidden');
                document.getElementById('btn-scan-start').classList.add('hidden');
                document.getElementById('btn-scan-stop').classList.remove('hidden');
                document.getElementById('scan-status').innerText = "Camera: Active / AI Running";
                isScanning = true;
                simulationAI(); // เริ่มตัวจำลอง AI
            } catch (err) { alert("Camera Error: " + err); }
        }

        function stopScan() {
            isScanning = false;
            const video = document.getElementById('scan-video');
            if (stream) stream.getTracks().forEach(t => t.stop());
            if (video) video.srcObject = null;
            const placeholder = document.getElementById('camera-placeholder');
            if (placeholder) placeholder.classList.remove('hidden');
            const box = document.getElementById('face-box');
            if (box) box.classList.add('hidden');
            
            const btnStart = document.getElementById('btn-scan-start');
            const btnStop = document.getElementById('btn-scan-stop');
            if (btnStart) btnStart.classList.remove('hidden');
            if (btnStop) btnStop.classList.add('hidden');
        }

        function toggleAutoCheckIn() {
            isAutoCheckIn = !isAutoCheckIn;
            const btn = document.getElementById('btn-autocheck');
            const dot = btn.querySelector('div');
            if (isAutoCheckIn) {
                btn.classList.replace('bg-slate-200', 'bg-emerald-500');
                dot.classList.replace('translate-x-0', 'translate-x-6');
                notify("Auto Check-in Enabled");
            } else {
                btn.classList.replace('bg-emerald-500', 'bg-slate-200');
                dot.classList.replace('translate-x-6', 'translate-x-0');
                notify("Auto Check-in Disabled", "error");
            }
        }

        // จำลองการทำงานของ AI เมื่อตรวจจับใบหน้า
        function simulationAI() {
            if (!isScanning) return;
            
            // สุ่มเวลาตรวจเจอใบหน้า (จำลอง)
            setTimeout(() => {
                if (!isScanning) return;
                
                // สุ่มนักเรียนจากข้อมูลที่มี
                if (currentStudents.length > 0) {
                    const randomStd = currentStudents[Math.floor(Math.random() * currentStudents.length)];
                    showFaceDetection(randomStd);
                } else {
                    showFaceDetection({ FullName: "Unknown User", StudentID: "????" });
                }

                // รันต่อเรื่อยๆ (จำลอง Loop)
                setTimeout(simulationAI, 4000);
            }, 3000);
        }

        function showFaceDetection(student) {
            const box = document.getElementById('face-box');
            const nameLabel = document.getElementById('detected-name');
            
            // แสดงกรอบสแกน
            box.classList.remove('hidden');
            box.style.width = "200px";
            box.style.height = "240px";
            nameLabel.innerText = student.FullName;

            // หากเปิด Auto Check-in และมีข้อมูลจริง
            if (isAutoCheckIn && student.StudentID !== "????") {
                notify(`Checking-in: ${student.FullName}`);
                if (typeof google !== 'undefined') {
                    google.script.run.checkInStudent(student.StudentID, student.FullName);
                }
            }

            // ซ่อนหลังจาก 2 วินาที
            setTimeout(() => { box.classList.add('hidden'); }, 2500);
        }

        // Enrollment
        async function openStudentModal() {
            document.getElementById('modal-student').classList.add('show-modal');
            captureStep = 0; capturedImages = [null, null, null];
            try {
                stream = await navigator.mediaDevices.getUserMedia({ video: true });
                document.getElementById('video').srcObject = stream;
            } catch (err) { alert("Camera denied"); }
        }

        function captureImage() {
            if (captureStep > 2) return;
            const video = document.getElementById('video');
            const canvas = document.createElement('canvas');
            canvas.width = video.videoWidth; canvas.height = video.videoHeight;
            const ctx = canvas.getContext('2d');
            ctx.translate(canvas.width, 0); ctx.scale(-1, 1);
            ctx.drawImage(video, 0, 0);
            const data = canvas.toDataURL('image/jpeg', 0.6);
            capturedImages[captureStep] = data;
            document.getElementById(`view-${captureStep}`).innerHTML = `<img src="${data}" class="w-full h-full object-cover">`;
            captureStep++;
            if (captureStep <= 2) {
                const labels = ["หน้า", "ซ้าย", "ขวา"];
                document.getElementById('step-label').innerText = "ขั้นตอน: บันทึกใบหน้าด้าน" + labels[captureStep];
            }
        }

        function saveStudent() {
            const id = document.getElementById('std-id').value;
            const name = document.getElementById('std-name').value;
            const room = document.getElementById('std-room').value;
            if (!id || !name || !capturedImages[2]) return alert("ข้อมูลไม่ครบ");
            notify("Saving to Sheet...");
            google.script.run.withSuccessHandler(res => {
                if (res.success) { notify("Registered!"); closeModal('modal-student'); refreshData(); }
            }).registerStudent({ id, name, room, faces: { front: capturedImages[0], left: capturedImages[1], right: capturedImages[2] } });
        }

        function openSubjectModal() { document.getElementById('modal-subject').classList.add('show-modal'); }
        function saveSubject() {
            const id = document.getElementById('sub-id').value;
            const name = document.getElementById('sub-name').value;
            if (!id || !name) return alert("ข้อมูลไม่ครบ");
            google.script.run.withSuccessHandler(() => { notify("Subject Added"); closeModal('modal-subject'); refreshData(); }).addSubject({id, name});
        }

        function closeModal(id) {
            document.getElementById(id).classList.remove('show-modal');
            if (stream) stream.getTracks().forEach(t => t.stop());
        }

        function clearSheet(type) {
            if (!confirm(`Confirm to wipe all data in ${type}?`)) return;
            google.script.run.withSuccessHandler(() => { notify("Wiped"); refreshData(); }).clearDatabase(type);
        }
    </script>
</body>
</html>

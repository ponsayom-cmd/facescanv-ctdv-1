<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart School AI System</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap');
        body { font-family: 'Inter', sans-serif; }
        .active-nav { background: white; color: #2563eb; box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1); }
        .modal { display: none; position: fixed; inset: 0; z-index: 100; background: rgba(15, 23, 42, 0.8); backdrop-filter: blur(4px); align-items: center; justify-content: center; }
        .show-modal { display: flex; }
        .video-flip { transform: scaleX(-1); }
    </style>
</head>
<body class="bg-slate-50 text-slate-700 h-screen flex overflow-hidden">

    <!-- Sidebar -->
    <aside class="w-64 bg-slate-900 text-slate-400 flex flex-col p-6 shrink-0 shadow-xl">
        <div class="flex items-center gap-3 mb-10">
            <div class="bg-blue-600 p-2 rounded-xl text-white shadow-lg shadow-blue-500/30">
                <i class="fas fa-id-badge fa-lg"></i>
            </div>
            <h1 class="font-black text-white text-lg tracking-tighter italic uppercase">AI SCHOOL</h1>
        </div>
        
        <nav class="flex-1 space-y-2">
            <button onclick="switchPage('dashboard')" id="nav-dashboard" class="nav-item w-full flex items-center gap-4 px-5 py-3.5 rounded-xl text-[10px] font-black uppercase tracking-widest transition-all active-nav">
                <i class="fas fa-chart-line text-lg"></i> <span>Dashboard</span>
            </button>
            <button onclick="switchPage('scan')" id="nav-scan" class="nav-item w-full flex items-center gap-4 px-5 py-3.5 rounded-xl text-[10px] font-black uppercase tracking-widest transition-all hover:text-white hover:bg-slate-800">
                <i class="fas fa-camera text-lg"></i> <span>AI Attendance</span>
            </button>
            <div class="h-px bg-slate-800 my-4"></div>
            <button onclick="switchPage('subjects')" id="nav-subjects" class="nav-item w-full flex items-center gap-4 px-5 py-3.5 rounded-xl text-[10px] font-black uppercase tracking-widest transition-all hover:text-white hover:bg-slate-800">
                <i class="fas fa-book text-lg"></i> <span>รายวิชา</span>
            </button>
            <button onclick="switchPage('students')" id="nav-students" class="nav-item w-full flex items-center gap-4 px-5 py-3.5 rounded-xl text-[10px] font-black uppercase tracking-widest transition-all hover:text-white hover:bg-slate-800">
                <i class="fas fa-users text-lg"></i> <span>นักศึกษา</span>
            </button>
            <button onclick="switchPage('settings')" id="nav-settings" class="nav-item w-full flex items-center gap-4 px-5 py-3.5 rounded-xl text-[10px] font-black uppercase tracking-widest transition-all hover:text-white hover:bg-slate-800">
                <i class="fas fa-cogs text-lg"></i> <span>ระบบ Admin</span>
            </button>
        </nav>

        <div class="mt-auto pt-4 border-t border-slate-800">
            <div id="connection-status" class="flex items-center gap-2 text-[10px] font-bold uppercase tracking-widest text-slate-500">
                <div class="w-2 h-2 rounded-full bg-emerald-500 animate-pulse"></div>
                Cloud Connected
            </div>
        </div>
    </aside>

    <!-- Main Content -->
    <main class="flex-1 flex flex-col overflow-hidden">
        <header class="h-16 bg-white border-b border-slate-200 px-8 flex items-center justify-between shrink-0">
            <h2 id="page-title" class="font-black text-slate-800 uppercase italic text-sm tracking-widest underline decoration-blue-500 decoration-4 underline-offset-8">Dashboard</h2>
            <button onclick="refreshData()" class="flex items-center gap-2 bg-slate-100 px-4 py-2 rounded-lg text-[10px] font-black uppercase hover:bg-slate-200 transition-all active:scale-95">
                <i class="fas fa-sync-alt" id="refresh-icon"></i> Sync Sheet Data
            </button>
        </header>

        <div id="content-area" class="flex-1 overflow-y-auto p-8">
            <!-- Content will be injected here via JavaScript -->
        </div>
    </main>

    <!-- Modal: Add Student -->
    <div id="modal-student" class="modal">
        <div class="bg-white w-full max-w-5xl rounded-[3rem] shadow-2xl overflow-hidden flex flex-col md:flex-row max-h-[90vh]">
            <div class="md:w-1/3 p-10 space-y-6 bg-slate-50 overflow-y-auto">
                <h3 class="text-2xl font-black text-slate-900 italic uppercase">New Student</h3>
                <div class="space-y-3">
                    <input type="text" id="std-id" placeholder="รหัสนักศึกษา" class="w-full bg-white p-4 rounded-xl border border-slate-200 outline-none font-bold text-sm focus:ring-2 focus:ring-blue-100">
                    <input type="text" id="std-name" placeholder="ชื่อ-นามสกุล" class="w-full bg-white p-4 rounded-xl border border-slate-200 outline-none font-bold text-sm focus:ring-2 focus:ring-blue-100">
                    <input type="text" id="std-room" placeholder="ชั้นเรียน (เช่น IT-1)" class="w-full bg-white p-4 rounded-xl border border-slate-200 outline-none font-bold text-sm focus:ring-2 focus:ring-blue-100">
                </div>
                <div class="grid grid-cols-3 gap-2 py-4">
                    <div id="view-0" class="aspect-square rounded-xl border-2 border-slate-200 bg-white flex items-center justify-center overflow-hidden"><span class="text-[8px] font-black text-slate-300 uppercase">หน้า</span></div>
                    <div id="view-1" class="aspect-square rounded-xl border-2 border-slate-200 bg-white flex items-center justify-center overflow-hidden"><span class="text-[8px] font-black text-slate-300 uppercase">ซ้าย</span></div>
                    <div id="view-2" class="aspect-square rounded-xl border-2 border-slate-200 bg-white flex items-center justify-center overflow-hidden"><span class="text-[8px] font-black text-slate-300 uppercase">ขวา</span></div>
                </div>
                <div class="space-y-2">
                    <button onclick="saveStudent()" class="w-full bg-blue-600 text-white py-4 rounded-xl font-black uppercase text-xs tracking-widest shadow-xl shadow-blue-500/20 active:scale-95 transition-all">บันทึกลง Sheet</button>
                    <button onclick="closeModal('modal-student')" class="w-full text-slate-400 font-bold uppercase text-[9px]">ยกเลิก</button>
                </div>
            </div>
            <div class="flex-1 bg-slate-900 p-8 flex flex-col items-center justify-center gap-6 relative">
                <div class="w-full max-w-lg aspect-video bg-slate-800 rounded-[2rem] overflow-hidden border-4 border-slate-700 shadow-2xl relative">
                    <video id="video" autoPlay playsInline muted class="w-full h-full object-cover video-flip"></video>
                    <div id="step-label" class="absolute top-4 left-4 bg-blue-600 text-white px-3 py-1 rounded-full text-[8px] font-black uppercase tracking-widest">
                        ขั้นตอน: บันทึกใบหน้าด้านตรง
                    </div>
                </div>
                <button onclick="captureImage()" class="w-20 h-20 bg-white rounded-full border-8 border-blue-600 shadow-2xl flex items-center justify-center active:scale-90 transition-all">
                    <div class="w-12 h-12 bg-blue-600 rounded-full animate-pulse"></div>
                </button>
            </div>
        </div>
    </div>

    <!-- Modal: Add Subject -->
    <div id="modal-subject" class="modal">
        <div class="bg-white w-full max-w-md rounded-[2.5rem] p-10 shadow-2xl">
            <h3 class="text-xl font-black italic uppercase mb-6 text-slate-800">Add New Subject</h3>
            <div class="space-y-4 mb-8">
                <input type="text" id="sub-id" placeholder="รหัสวิชา (e.g. IT101)" class="w-full bg-slate-100 p-4 rounded-xl border-none outline-none font-bold text-sm focus:bg-white focus:ring-2 focus:ring-blue-100">
                <input type="text" id="sub-name" placeholder="ชื่อวิชาเรียน" class="w-full bg-slate-100 p-4 rounded-xl border-none outline-none font-bold text-sm focus:bg-white focus:ring-2 focus:ring-blue-100">
            </div>
            <div class="flex gap-3">
                <button onclick="saveSubject()" class="flex-1 bg-emerald-500 text-white py-4 rounded-xl font-black uppercase text-xs shadow-lg shadow-emerald-500/20 active:scale-95 transition-all">Confirm Add</button>
                <button onclick="closeModal('modal-subject')" class="flex-1 bg-slate-100 text-slate-400 py-4 rounded-xl font-black uppercase text-xs">Close</button>
            </div>
        </div>
    </div>

    <!-- Toast Notification -->
    <div id="toast" class="fixed top-10 left-1/2 -translate-x-1/2 z-[200] px-6 py-3 rounded-xl shadow-2xl font-bold text-white transition-all hidden animate-bounce"></div>

    <script>
        let currentStudents = [];
        let currentSubjects = [];
        let captureStep = 0;
        let capturedImages = [null, null, null];
        let stream = null;

        // Start Application
        window.onload = () => {
            refreshData();
            switchPage('dashboard');
        };

        function notify(msg, type = 'success') {
            const toast = document.getElementById('toast');
            toast.innerText = msg;
            toast.className = `fixed top-10 left-1/2 -translate-x-1/2 z-[200] px-6 py-3 rounded-xl shadow-2xl font-bold text-white transition-all animate-bounce ${type === 'success' ? 'bg-emerald-500' : 'bg-rose-500'}`;
            toast.classList.remove('hidden');
            setTimeout(() => toast.classList.add('hidden'), 3000);
        }

        async function refreshData() {
            const icon = document.getElementById('refresh-icon');
            icon.classList.add('fa-spin');

            if (typeof google !== 'undefined') {
                google.script.run.withSuccessHandler(data => {
                    currentStudents = data || [];
                    updateUI();
                    icon.classList.remove('fa-spin');
                }).getStudents();

                google.script.run.withSuccessHandler(data => {
                    currentSubjects = data || [];
                    updateUI();
                }).getSubjects();
            } else {
                // Mock for local test preview
                setTimeout(() => {
                    currentStudents = [{StudentID: 'STD001', FullName: 'ระบบทดลอง ออฟไลน์', Room: 'IT-1'}];
                    currentSubjects = [{id: 'SUB01', name: 'Computer Vision AI'}];
                    updateUI();
                    icon.classList.remove('fa-spin');
                }, 1000);
            }
        }

        function switchPage(page) {
            document.querySelectorAll('.nav-item').forEach(el => el.classList.remove('active-nav'));
            document.getElementById(`nav-${page}`).classList.add('active-nav');
            document.getElementById('page-title').innerText = page.toUpperCase();
            renderPage(page);
        }

        function renderPage(page) {
            const area = document.getElementById('content-area');
            if (page === 'dashboard') {
                area.innerHTML = `
                    <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-6 animate-in fade-in duration-500">
                        <div class="bg-white p-8 rounded-[2rem] border border-slate-200 shadow-sm relative overflow-hidden group">
                            <i class="fas fa-user-graduate absolute -right-4 -bottom-4 text-slate-50 text-7xl group-hover:text-blue-50 transition-all"></i>
                            <p class="text-[9px] font-black uppercase text-slate-400 tracking-[0.2em] relative z-10">นักศึกษาทั้งหมด</p>
                            <h3 class="text-4xl font-black text-blue-600 relative z-10">${currentStudents.length}</h3>
                        </div>
                        <div class="bg-white p-8 rounded-[2rem] border border-slate-200 shadow-sm relative overflow-hidden group">
                            <i class="fas fa-book-open absolute -right-4 -bottom-4 text-slate-50 text-7xl group-hover:text-indigo-50 transition-all"></i>
                            <p class="text-[9px] font-black uppercase text-slate-400 tracking-[0.2em] relative z-10">รายวิชาเรียน</p>
                            <h3 class="text-4xl font-black text-indigo-600 relative z-10">${currentSubjects.length}</h3>
                        </div>
                        <div class="bg-white p-8 rounded-[2rem] border border-slate-200 shadow-sm border-l-4 border-l-emerald-500">
                            <p class="text-[9px] font-black uppercase text-slate-400 tracking-[0.2em]">เช็คชื่อวันนี้</p>
                            <h3 class="text-4xl font-black text-emerald-600">0</h3>
                        </div>
                    </div>
                `;
            } else if (page === 'scan') {
                area.innerHTML = `
                    <div class="max-w-4xl mx-auto flex flex-col items-center gap-8 py-10 animate-in zoom-in duration-500">
                        <div class="text-center space-y-2">
                            <h2 class="text-3xl font-black text-slate-900 uppercase italic">Face Recognition</h2>
                            <p class="text-slate-500 font-bold uppercase text-[10px] tracking-[0.3em]">AI-Powered Attendance System</p>
                        </div>
                        <div class="w-full aspect-video bg-slate-900 rounded-[3rem] border-8 border-white shadow-2xl relative overflow-hidden flex items-center justify-center group">
                            <i class="fas fa-camera text-slate-800 text-6xl"></i>
                            <div class="absolute inset-0 bg-blue-500/5 animate-pulse"></div>
                            <div class="absolute bottom-6 left-1/2 -translate-x-1/2 bg-white/10 backdrop-blur-md px-6 py-2 rounded-full text-white font-black text-[10px] uppercase tracking-widest border border-white/20">
                                System Standby
                            </div>
                        </div>
                        <button class="bg-blue-600 text-white px-12 py-5 rounded-2xl font-black uppercase text-xs tracking-widest shadow-xl shadow-blue-500/40 hover:scale-105 active:scale-95 transition-all">
                           <i class="fas fa-play mr-2"></i> Start Scanning
                        </button>
                    </div>
                `;
            } else if (page === 'students') {
                area.innerHTML = `
                    <div class="space-y-6">
                        <div class="flex justify-between items-center">
                            <h3 class="font-black text-slate-800 uppercase italic">Registered Students</h3>
                            <button onclick="openStudentModal()" class="bg-blue-600 text-white px-6 py-3 rounded-xl font-bold text-xs flex items-center gap-2 shadow-lg shadow-blue-500/20 active:scale-95">
                                <i class="fas fa-user-plus"></i> New Registration
                            </button>
                        </div>
                        <div class="bg-white rounded-[2rem] border border-slate-200 shadow-sm overflow-hidden">
                            <table class="w-full text-left">
                                <thead class="bg-slate-50 border-b border-slate-100">
                                    <tr>
                                        <th class="p-5 text-[10px] font-black uppercase text-slate-400 tracking-widest">Student ID</th>
                                        <th class="p-5 text-[10px] font-black uppercase text-slate-400 tracking-widest">Full Name & Room</th>
                                        <th class="p-5 text-[10px] font-black uppercase text-slate-400 text-right">Action</th>
                                    </tr>
                                </thead>
                                <tbody class="divide-y divide-slate-50">
                                    ${currentStudents.map(s => `
                                        <tr class="hover:bg-slate-50/50 transition-all">
                                            <td class="p-5 font-bold text-blue-600 tracking-tighter">#${s.StudentID}</td>
                                            <td class="p-5 font-black uppercase text-slate-700">${s.FullName} <span class="text-slate-300 mx-2">|</span> <span class="text-slate-400 font-bold">${s.Room}</span></td>
                                            <td class="p-5 text-right">
                                                <button class="text-slate-200 hover:text-rose-500 transition-colors p-2"><i class="fas fa-trash-alt"></i></button>
                                            </td>
                                        </tr>
                                    `).join('')}
                                    ${currentStudents.length === 0 ? '<tr><td colspan="3" class="p-16 text-center text-slate-400 font-black italic uppercase tracking-widest">Empty Dataset</td></tr>' : ''}
                                </tbody>
                            </table>
                        </div>
                    </div>
                `;
            } else if (page === 'subjects') {
                area.innerHTML = `
                    <div class="space-y-6">
                        <div class="flex justify-between items-center">
                            <h3 class="font-black text-slate-800 uppercase italic">Subject Management</h3>
                            <button onclick="openSubjectModal()" class="bg-emerald-500 text-white px-6 py-3 rounded-xl font-bold text-xs flex items-center gap-2 shadow-lg shadow-emerald-500/20 active:scale-95">
                                <i class="fas fa-plus"></i> Add Subject
                            </button>
                        </div>
                        <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
                            ${currentSubjects.map(sub => `
                                <div class="bg-white p-8 rounded-[2rem] border border-slate-200 shadow-sm group hover:border-blue-500 transition-all flex justify-between items-start">
                                    <div class="space-y-1">
                                        <p class="text-[9px] font-black text-slate-400 uppercase tracking-widest">${sub.id}</p>
                                        <h4 class="text-lg font-black text-slate-800 uppercase leading-tight">${sub.name}</h4>
                                    </div>
                                    <div class="bg-slate-50 p-3 rounded-xl text-slate-200 group-hover:text-blue-500 group-hover:bg-blue-50 transition-all">
                                        <i class="fas fa-book"></i>
                                    </div>
                                </div>
                            `).join('')}
                            ${currentSubjects.length === 0 ? '<div class="col-span-full py-20 text-center font-black text-slate-200 uppercase tracking-widest italic text-2xl">No Subjects Defined</div>' : ''}
                        </div>
                    </div>
                `;
            } else if (page === 'settings') {
                area.innerHTML = `
                    <div class="max-w-xl space-y-6 animate-in slide-in-from-bottom duration-500">
                        <div class="bg-white p-10 rounded-[2.5rem] border border-slate-200 shadow-sm">
                            <h3 class="font-black uppercase italic mb-8 flex items-center gap-3 text-slate-800">
                                <i class="fas fa-database text-blue-500"></i> Database Wipe Tools
                            </h3>
                            <div class="space-y-4">
                                <div class="flex items-center justify-between p-5 bg-slate-50 rounded-2xl border border-slate-100">
                                    <div>
                                        <p class="font-black text-slate-800 text-sm">Students Database</p>
                                        <p class="text-[10px] text-slate-400 uppercase font-bold tracking-wider">ล้างข้อมูลนักศึกษาทั้งหมด</p>
                                    </div>
                                    <button onclick="clearSheet('Students')" class="bg-rose-100 text-rose-500 px-5 py-2.5 rounded-xl text-[9px] font-black uppercase hover:bg-rose-500 hover:text-white transition-all">Clear</button>
                                </div>
                                <div class="flex items-center justify-between p-5 bg-slate-50 rounded-2xl border border-slate-100">
                                    <div>
                                        <p class="font-black text-slate-800 text-sm">Subjects Database</p>
                                        <p class="text-[10px] text-slate-400 uppercase font-bold tracking-wider">ล้างข้อมูลรายวิชาทั้งหมด</p>
                                    </div>
                                    <button onclick="clearSheet('Subjects')" class="bg-rose-100 text-rose-500 px-5 py-2.5 rounded-xl text-[9px] font-black uppercase hover:bg-rose-500 hover:text-white transition-all">Clear</button>
                                </div>
                            </div>
                        </div>
                    </div>
                `;
            }
        }

        function updateUI() {
            const currentTitle = document.getElementById('page-title').innerText.toLowerCase();
            renderPage(currentTitle);
        }

        // Student Enrollment Functions
        async function openStudentModal() {
            document.getElementById('modal-student').classList.add('show-modal');
            captureStep = 0;
            capturedImages = [null, null, null];
            document.getElementById('step-label').innerText = "ขั้นตอน: บันทึกใบหน้าด้านตรง";
            for(let i=0; i<3; i++) document.getElementById(`view-${i}`).innerHTML = `<span class="text-[8px] font-black text-slate-300 uppercase">${['หน้า','ซ้าย','ขวา'][i]}</span>`;
            
            try {
                stream = await navigator.mediaDevices.getUserMedia({ video: true });
                document.getElementById('video').srcObject = stream;
            } catch (err) {
                alert("Access Denied: ไม่สามารถเปิดกล้องได้");
            }
        }

        function captureImage() {
            if (captureStep > 2) return;
            const video = document.getElementById('video');
            const canvas = document.createElement('canvas');
            canvas.width = video.videoWidth;
            canvas.height = video.videoHeight;
            const ctx = canvas.getContext('2d');
            
            // Flip horizontal to match video preview
            ctx.translate(canvas.width, 0);
            ctx.scale(-1, 1);
            ctx.drawImage(video, 0, 0);
            
            const data = canvas.toDataURL('image/jpeg', 0.6);
            capturedImages[captureStep] = data;
            
            document.getElementById(`view-${captureStep}`).innerHTML = `<img src="${data}" class="w-full h-full object-cover">`;
            
            captureStep++;
            if (captureStep <= 2) {
                const labels = ["ตรง", "ซ้าย", "ขวา"];
                document.getElementById('step-label').innerText = "ขั้นตอน: บันทึกใบหน้าด้าน" + labels[captureStep];
            } else {
                document.getElementById('step-label').innerText = "ใบหน้าครบ 3 มุมเรียบร้อยแล้ว";
            }
        }

        function saveStudent() {
            const id = document.getElementById('std-id').value;
            const name = document.getElementById('std-name').value;
            const room = document.getElementById('std-room').value;

            if (!id || !name || !capturedImages[2]) {
                return alert("กรุณากรอกข้อมูลและบันทึกใบหน้าให้ครบ 3 มุม");
            }

            const payload = {
                id, name, room,
                faces: { front: capturedImages[0], left: capturedImages[1], right: capturedImages[2] }
            };

            notify("Saving to Google Cloud...");
            if (typeof google !== 'undefined') {
                google.script.run.withSuccessHandler(res => {
                    if (res.success) {
                        notify("Student Registered Successfully!");
                        closeModal('modal-student');
                        refreshData();
                        document.getElementById('std-id').value = '';
                        document.getElementById('std-name').value = '';
                        document.getElementById('std-room').value = '';
                    } else {
                        notify("Error: " + res.message, "error");
                    }
                }).registerStudent(payload);
            }
        }

        // Subject Functions
        function openSubjectModal() {
            document.getElementById('modal-subject').classList.add('show-modal');
        }

        function saveSubject() {
            const id = document.getElementById('sub-id').value;
            const name = document.getElementById('sub-name').value;
            if (!id || !name) return alert("กรุณากรอกข้อมูลให้ครบ");

            notify("Adding Subject...");
            if (typeof google !== 'undefined') {
                google.script.run.withSuccessHandler(() => {
                    notify("Subject Added!");
                    closeModal('modal-subject');
                    refreshData();
                    document.getElementById('sub-id').value = '';
                    document.getElementById('sub-name').value = '';
                }).addSubject({id, name});
            }
        }

        function closeModal(id) {
            document.getElementById(id).classList.remove('show-modal');
            if (id === 'modal-student' && stream) {
                stream.getTracks().forEach(t => t.stop());
                stream = null;
            }
        }

        function clearSheet(type) {
            if (!confirm(`ยืนยันการลบข้อมูลในตาราง ${type} ทั้งหมด? การกระทำนี้ไม่สามารถย้อนกลับได้`)) return;
            notify(`Clearing ${type}...`);
            if (typeof google !== 'undefined') {
                google.script.run.withSuccessHandler(() => {
                    notify(`${type} Database Wiped.`);
                    refreshData();
                }).clearDatabase(type);
            }
        }
    </script>
</body>
</html>
